
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">
<div th:replace="~{fragments/layout :: layout(~{::mainContent})}"></div>

<th:block th:fragment="mainContent">

    <main>

        <!-- Welcome -->
        <div class="mb-4">
            <h2>Welcome to Eligibility Portal</h2>
            <p class="text-muted">
                Manage applications and household eligibility information.
            </p>
        </div>

        <!-- Dashboard Cards -->
        <div class="row g-4">

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5>Total Applications</h5>
                        <h2>125</h2>
                        <a th:href="@{/applications}">View Applications</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5>Pending Applications</h5>
                        <h2>35</h2>
                        <a th:href="@{/applications}">Review Pending</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5>Approved Applications</h5>
                        <h2>90</h2>
                        <a th:href="@{/applications}">View Approved</a>
                    </div>
                </div>
            </div>

        </div>

        <!-- Quick Actions -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">Quick Actions</h5>
            </div>

            <div class="card-body">
                <a class="btn btn-primary me-2"
                   th:href="@{/applications/new}">
                    New Application
                </a>

                <a class="btn btn-outline-primary"
                   th:href="@{/applications}">
                    Search Applications
                </a>
            </div>
        </div>

    </main>

</th:block>
