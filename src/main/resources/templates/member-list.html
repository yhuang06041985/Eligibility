<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<!-- Main Content -->
<main class="container-fluid dashboard-container">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Search Household</h3>
            <a th:href="@{/member/new}" class="btn btn-info">
                Create Household Member
            </a>
        </div>

        <!-- Search Form -->
        <div class="card mb-4">
            <div class="card-body">

                <form th:action="@{/member/list}"
                      method="get">

                    <div class="row mb-3">

                        <div class="col-md-5">
                            <label class="form-label">Household Name</label>
                            <input type="text"
                                   name="householdName"
                                   class="form-control"
                                   th:value="${householdname}">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Applicant First Name</label>
                            <input type="text"
                                   name="firstName"
                                   class="form-control"
                                   th:value="${firstName}">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Applicant Last Name</label>
                            <input type="text"
                                   name="lastName"
                                   class="form-control"
                                   th:value="${lastName}">
                        </div>

                        <div class="col-md-12 mt-3">
                            <button type="submit"
                                    class="btn btn-primary">
                                Search
                            </button>
                        </div>

                    </div>

                </form>

            </div>
        </div>


        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                <tr>
                    <th>Household Name</th>
                    <th>Member name</th>
                    <th>Relationship</th>
                    <th>Is Primary Applicant</th>
                    <th>Start Date</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.householdName}"></td>
                    <td th:text="${member.fullNmae}"></td>
                    <td th:text="${member.relationship}"></td>
                    <td th:text="${memeber.isPrimaryApplicant}"></td>
                    <td th:text="${startDate}"></td>

                    <td>
                        <a th:href="@{/member/details/{id}(id=${member.id})}">Details</a>
                        <a th:href="@{/member/delete/{id}(id=${member.id})}"
                           class="btn btn-danger"
                           onclick="return confirm('Are you sure you want to delete this address?')">
                            Delete</a>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>

    </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
