<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<main>

    <div class="container mt-4">

        <div class="card shadow-sm">

            <div class="card-header">
                <h5>Income Record Create</h5>
            </div>

            <div class="card-body">

                <form th:action="@{/income/save}"
                      method="post"
                      th:object="${income}">
                    <!-- Hidden fields -->
                    <input type="hidden" id="memberId" name="memberId">

                    <div class="mb-3">

                        <div class="input-group">
                            <lable class="form-control">Member Name</lable>
                            <input type="text"
                                   id="memberFullName"
                                   class="form-control" required
                                   placeholder="Select an Household"
                                   readonly>
                            <button type="button"
                                    class="btn btn-outline-primary"
                                    onclick="openMemberWindow()">
                                Select
                            </button>

                        </div>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Income Type</label>
                        <input th:field="*{incomeType}"
                               required class="form-control">

                    </div>
                    <div class="mb-3">
                        <label class="form-label">employer Name</label>
                        <input th:field="*{employerName}"
                               required class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Gross Amount</label>
                        <input th:field="*{grossAmount}" type="number"
                               required class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Pay Peiod</label>
                        <input  th:field="*{payFrequency}" required >

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Monthly Amount</label>
                        <input type="number" required th:field="*{monthlyAmount}" >

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Is Active</label>
                        <input type="checkbox" th:field="*{isActive}" >

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Start Date</label>
                        <input th:field="*{startDate}"  type="date" required class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">End Date</label>
                        <input type="date" th:field="*{endDate}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary">Create</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>
            </div>
        </div>
    </div>>

    <script>

        function openMemberWindow() {

            window.open(
                '/income/select-member',
                'member-search',
                'width=750,height=550'
            );

        }

        // Called by the child window
        function setMember(memberId, memberFullName) {

            document.getElementById('memberId').value = memberId;

            document.getElementById('memberFullName').value = memberFullName;

        }

    </script>
</main>


</html>
