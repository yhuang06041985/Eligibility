<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Eligibility System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>

<body>

<!-- Header and Navigation -->
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">

            <a class="navbar-brand" th:href="@{/}">
                Eligibility System
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/households}">
                            Households
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/members}">
                            Members
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/applications}">
                            Applications
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/benefits}">
                            Benefits
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/settings}">
                            Settings
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>
</header>

<!-- Main Content -->
<main class="container-fluid mt-4">

    <th:block th:replace="${content}"></th:block>

</main>

<!-- Footer -->
<footer class="container-fluid mt-5 py-3 border-top">
    <p class="text-center text-muted mb-0">
        Eligibility Management System
    </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
