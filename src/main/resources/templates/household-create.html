<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<main>

    <div class="container mt-4">

        <div class="card shadow-sm">

            <div class="card-header">
                <h5>Househole Create</h5>
            </div>

            <div class="card-body">

                <form th:action="@{/household/save}"
                      method="post"
                      th:object="${household}">
                    <!-- Hidden fields -->
                    <input type="hidden" name="applicantId"  id="applicantId">
                    <div class="mb-3">

                        <div class="input-group">
                        <label class="form-label">Select an Household</label>
                           &nbsp;&nbsp;
                         <input type="text"
                                th:field="*{householdName}"
                                    name="householdName"
                                   id="applicantFullName"
                                   class="form-control"
                                   placeholder="Select an House"
                                   readonly>

                            &nbsp;<button type="button"
                                    class="btn btn-outline-primary"
                                    onclick="openApplicantWindow()">
                                Select
                            </button>

                        </div>

                    </div>


                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary">Create</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>
            </div>
        </div>
    </div>>

    <script>

        function openApplicantWindow() {

            window.open(
                '/household/select-applicant',
                'applicant-search',
                'width=1000,height=650'
            );

        }

        // Called by the child window
        function setApplicant(applicantId, applicantFullName) {

            document.getElementById('applicantId').value = applicantId;

            document.getElementById('applicantFullName').value = applicantFullName;

        }

    </script>
</main>


</html>
