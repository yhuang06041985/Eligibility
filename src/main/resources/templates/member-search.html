<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<main>
    <div class="container mt-4">

        <h4 class="mb-3">Search Household Member</h4>

        <!-- Search Form -->
        <div class="card mb-4">
            <div class="card-body">

                <form th:action="@{/income/search-member-name}"
                      method="get">

                    <div class="row mb-3">
                        <div class="col-md-5">
                            <label class="form-label">Household Name</label>
                            <input type="text"
                                   name="householdName"
                                   class="form-control"
                                   th:value="${householdName}">
                        </div>

                        <div class="col-md-5">
                            <label class="form-label">Member First Name</label>
                            <input type="text"
                                   name="firstName"
                                   class="form-control"
                                   th:value="${firstName}">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Member Last Name</label>
                            <input type="text"
                                   name="lastName"
                                   class="form-control"
                                   th:value="${lastName}">
                        </div>

                        <div class="col-md-12 mt-3">
                            <button type="submit"
                                    class="btn btn-primary">
                                Search
                            </button>
                        </div>

                    </div>

                </form>

            </div>
        </div>

        <!-- Search Results -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Search Results</h5>
            </div>

            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Member Id</th>
                        <th>Member Full Name</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="member : ${members}">

                        <td th:text="${member.id}"></td>

                        <td th:text="${member.fullName}"></td>

                        <td>
                            <button type="button"
                                    class="btn btn-primary btn-sm"
                                    th:attr="data-id=${member.Id},

                           data-name=${member.fullName}"
                                    onclick="selectMember(this)">
                                Select
                            </button>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(households)}">
                        <td colspan="3" class="text-center">
                            No applicant found.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>
        </div>

    </div>

    <script>
        function selectMember(button) {

            if (window.opener && !window.opener.closed) {

                window.opener.setMember(
                    button.dataset.id,
                    button.dataset.name

                );

                window.close();
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</main>

</html>
