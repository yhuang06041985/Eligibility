<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main})}">

<main>

    <div class="container mt-4">

        <div class="card shadow-sm">

            <div class="card-header">
                <h5>Applicant Create</h5>
            </div>

            <div class="card-body">

                <form th:action="@{/applicant/update/{id}(id=${applicant.id})}"
                      method="post"
                      th:object="${applicant}">

                    <input th:value="${applicant.id}" name="applicantId" hidden>
                    <div class="mb-e">
                        <label class="form-label">First Nmae</label>
                        <input th:field="*{firstName}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Middle Name</label>
                        <input th:field="*{middleName}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input th:field="*{lastName}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Date of Birth
                        </label>
                        <input type="date"
                               name="dateOfBirth"
                               th:value="${#temporals.format(applicant.dateOfBirth, 'yyyy-MM-dd')}"
                               class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last 4 Digit SSN</label>
                        <input th:field="*{ssnLast4}" class="form-control"
                               maxlength="4"
                               pattern="[0-9]{4}"
                               inputmode="numeric"
                               minlength="4">

                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input th:field="*{email}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input th:field="*{phone}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary">Update</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</main>
</html>
